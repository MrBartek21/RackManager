<!doctype html>
<html lang="pl" data-page="events">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#090d17">
		<meta name="description" content="Lokalny panel monitorowania szafy RackManager.">

		<title>RackManager | Dziennik zdarzeń</title>

		<link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
		<link rel="stylesheet" href="/styles/main.css">
		<script src="app.js" defer></script>
	</head>
	<body>
		<div class="app-shell">

			<aside class="sidebar">
				<a class="brand" href="/index.html" aria-label="RackManager — strona główna">
					<span class="brand-mark">R</span>
					<span>Rack<span class="brand-light">Manager</span></span>
				</a>

        		<div class="nav-caption">ZARZĄDZANIE</div>
				<nav class="nav-list" aria-label="Główna nawigacja">
					<a class="nav-item" href="/index.html"><span class="nav-icon"><i class="bi bi-postcard" aria-hidden="true"></i></span>Przegląd <span class="nav-arrow">↗</span></a>
					<a class="nav-item" href="/devices.html"><span class="nav-icon"><i class="bi bi-hdd" aria-hidden="true"></i></span>Urządzenia <span class="nav-count" id="device-count">0</span></a>
					<a class="nav-item active" href="/events.html"><span class="nav-icon"><i class="bi bi-calendar-event" aria-hidden="true"></i></span>Zdarzenia</a>
					<a class="nav-item" href="/automations.html"><span class="nav-icon"><i class="bi bi-gear" aria-hidden="true"></i></span>Automatyzacje</a>
				</nav>
				<div class="sidebar-bottom">
					<div class="sidebar-info">
						<div class="info-icon"><i class="bi bi-github" aria-hidden="true"></i></div>
						<div class="sidebar-version">
							<strong>RackManager</strong>
              				<span>Wersja 2.0.0</span>
              				<a class="update-status" id="github-update-status" href="https://github.com/MrBartek21/RackManager" target="_blank" rel="noopener noreferrer">Sprawdzanie GitHuba…</a>
						</div>
              			<span class="version-dot checking" id="github-update-dot"></span>
					</div>
				</div>
			</aside>

			<main class="main-content" id="overview">

				<header class="topbar">
					<div class="breadcrumb"><strong>Dziennik zdarzeń</strong></div>
					<div class="topbar-right">
						<div class="clock"><span id="clock">--:--:--</span></div>
            			<div class="clock"><span id="last-update">Oczekiwanie...</span></div>
						<div class="connection" id="connection"><span></span><b id="connection-label">Łączenie</b></div>
					</div>
				</header>
				<section class="events-page" id="events-page">
					<div class="page-title">
						<div><span>Pełna historia zapisywana przez serwer.</span></div>
						<button class="secondary-button" id="clear-events" type="button"><i class="bi bi-trash3"></i> Wyczyść dziennik</button>
					</div>
					<article class="panel directory-panel">
						<div class="event-list full-event-list" id="all-event-list"></div>
						<div class="empty-placeholder" id="events-empty">Zdarzenia pojawią się tutaj podczas pracy panelu.</div>
					</article>
				</section>

			</main>

		</div>
	</body>
</html>
